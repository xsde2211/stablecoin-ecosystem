# /etc/nginx/sites-available/gateway.conf
# Reverse proxy: Internet → Nginx (this file) → gateway container (loopback
# only) → internal microservices (never reachable from outside the VM).
#
# Certbot will rewrite the server block below the first time you run it —
# this starts as plain HTTP so Certbot's HTTP-01 challenge can complete,
# then `certbot --nginx` edits this file in place to add the HTTPS block
# and redirect. Don't hand-write the SSL block yourself; let Certbot do it.

server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;   # ← replace with your real domain

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Bridge/mint calls can involve on-chain waits — don't let nginx
        # time out a request the gateway is still legitimately processing.
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }
}

