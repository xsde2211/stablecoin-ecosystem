# docker-compose.yml
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stablecoin
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports: ["6379:6379"]

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports: ["9092:9092"]

  gateway:
    build: ./services/gateway
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/stablecoin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KAFKA_BROKERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    ports: ["3001:3001"]
    depends_on: [postgres, redis, kafka]

  auth-service:
    build: ./services/auth-service
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/stablecoin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
    ports: ["3002:3002"]
    depends_on: [postgres, redis]

  wallet-service:
    build: ./services/wallet-service
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/stablecoin
      TRON_RPC: ${TRON_RPC}
      ETH_RPC: ${ETH_RPC}
      BSC_RPC: ${BSC_RPC}
      POLYGON_RPC: ${POLYGON_RPC}
      KMS_KEY_ID: ${KMS_KEY_ID}
    ports: ["3003:3003"]
    depends_on: [postgres]

  bridge-service:
    build: ./services/bridge-service
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/stablecoin
      KAFKA_BROKERS: kafka:9092
      RELAYER_PRIVATE_KEY: ${RELAYER_PRIVATE_KEY}
      ETH_BRIDGE_ADDRESS: ${ETH_BRIDGE_ADDRESS}
      BSC_BRIDGE_ADDRESS: ${BSC_BRIDGE_ADDRESS}
    ports: ["3004:3004"]
    depends_on: [postgres, kafka]

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://gateway:3001
    ports: ["3000:3000"]
    depends_on: [gateway]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    ports: ["3100:3000"]
    depends_on: [prometheus]

volumes:
  postgres_data: